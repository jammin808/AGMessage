# AGMessage CI. Every push (any branch) and pull request runs the analyzers, the secret scan, every test suite with its
# coverage gate on Linux (Node 24 LTS, and Node 26 beside it), the suites again on a checkout with Windows' line ends
# (CR LF) on Linux, the tests and the browser smoke on Windows with Edge and on Linux with Chrome, then builds the
# portable Windows zip, numbered by this run (tools/stamp-build.js): its build is the run less app/package.json's
# agmessage.runBase, a development build 0.6.0-dev.<build>+<sha> on a branch, a release 0.6.0+<build>.<sha> on the tag
# v0.6.0. The zip is extracted and started once, and must answer with that build. The zip is also an artifact of its own,
# the zip itself (archive: false). The installer is built from that zip on
# windows-2025 (Inno Setup 7.1.0, pinned), without its two .bat files, and its life cycle run for real there, elevated, on
# the image as it is (Defender's real-time monitoring off, as the image leaves it): installed, upgraded from the build
# before it, refused, rolled back, gone back from and uninstalled, every test it declares run and passed. A tag publishes a GitHub Release with the zip, the installer and its payload's sums, the SBOM, SHA256SUMS
# and a build-provenance attestation of the zips, the installer and its payload's sums, verified before it publishes and
# the release read back for its immutability once it has, once every job above is green and only when its version is
# above every release already published and every other version tagged, asked again just before it publishes, one
# release job at a time. For every push, a tag and a run asked for by hand (Actions, CI, Run workflow),
# the Windows evidence lane takes its readings of that zip on windows-2025, those that need Defender with its real-time
# monitoring back on, then the rest with it put back as the image left it, one lane at a time per ref and never cancelled
# once it runs: they inform the release's notes and never hold it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No group for the whole run: each job says what a newer run of its ref does to it. The tests and the zip of a newer push
# or pull request cancel the older run's (a run asked for by hand has groups of its own a push never touches); the
# readings are never cancelled once they run, and a newer push's wait their turn (one waits per ref: a newer one takes
# its place), so every push's readings are taken unless a newer push's are waiting, and none is thrown away half-taken.

env:
  # The runtime the portable bundle ships (tools/fetch-runtime.ps1 pins the same version by SHA-256).
  NODE_LTS: '24.22.1'

jobs:
  analyze:
    name: Analyzers, secret scan, version
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-analyze-${{ github.event_name == 'workflow_dispatch' && 'by-hand' || 'auto' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      # The fences (eslint.config.mjs; docs/ANALYSIS.md): any finding fails the build.
      - name: Analyzers (ESLint, the security rules, the banned calls, HTML only from escaped parts)
        run: npm run lint
        working-directory: app
      - name: Secret scan (tools/scan-secrets.js)
        run: node tools/scan-secrets.js
      # A tag is released only when it names app/package.json's version and that version is above every release already
      # published and every other version tagged (SemVer), so among releases SemVer and MAJOR.MINOR.BUILD, the order
      # "newer" is read by, agree. Asked here first, so a tag that would be refused stops before the tests; the release
      # job asks again just before it publishes. A list that cannot be read stops the release: the assignment fails the
      # step.
      - name: The version this commit builds as
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/stamp-build.js --print
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            released="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName')"
            tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')"
            node tools/stamp-build.js --check-tag "${GITHUB_REF_NAME}" --released "$released" --tags "$tags"
          fi

  test-linux:
    name: Tests (Node ${{ matrix.node }}, Linux)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-test-linux-${{ matrix.node }}-${{ github.event_name == 'workflow_dispatch' && 'by-hand' || 'auto' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 24 is the LTS the bundle ships; 26 enters LTS on 2026-10-28 and is proven here before the bundle moves to it.
        node: ['24.22.1', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Unit, end-to-end and watchdog tests with the coverage gate
        if: matrix.node == env.NODE_LTS
        run: npm run coverage
        working-directory: app
      - name: Unit, end-to-end and watchdog tests
        if: matrix.node != env.NODE_LTS
        run: npm test
        working-directory: app
      - name: Browser smoke (headless Chrome)
        if: matrix.node == env.NODE_LTS
        run: npm run smoke
        working-directory: app
        env:
          AGM_BROWSER: /usr/bin/google-chrome
          AGM_SMOKE_OUT: ${{ github.workspace }}/artifacts/smoke-linux
      - name: Upload screenshots
        if: always() && matrix.node == env.NODE_LTS
        uses: actions/upload-artifact@v7
        with:
          name: smoke-linux-${{ github.sha }}
          path: artifacts/smoke-linux
          if-no-files-found: ignore

  # The suites as a Windows checkout has them, on Linux: every text file the .gitattributes leaves to the platform
  # checked out again with CR LF line ends, as Git for Windows does. A test that reads a source and assumes LF fails
  # here, in minutes, before the Windows job.
  test-crlf:
    name: Tests on a CR LF checkout (Node 24, Linux)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-test-crlf-${{ github.event_name == 'workflow_dispatch' && 'by-hand' || 'auto' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check the tree out again with Windows' line ends
        run: |
          git config core.autocrlf true
          git ls-files -z | xargs -0 rm -f --
          git checkout -- .
          if ! grep -q $'\r$' app/server.js; then echo "::error::app/server.js was not checked out with CR LF"; exit 1; fi
          if grep -q $'\r' app/public/vendor/VENDOR.json; then echo "::error::a vendored file was converted"; exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Unit, end-to-end and watchdog tests
        run: npm test
        working-directory: app

  test-windows:
    name: Tests and browser smoke (Windows, Edge)
    runs-on: windows-latest
    concurrency:
      group: ci-${{ github.ref }}-test-windows-${{ github.event_name == 'workflow_dispatch' && 'by-hand' || 'auto' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit, end-to-end and watchdog tests
        run: npm test
      - name: Browser smoke (headless Microsoft Edge)
        run: npm run smoke
        env:
          AGM_SMOKE_OUT: ${{ github.workspace }}/artifacts/smoke-windows
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-windows-${{ github.sha }}
          path: artifacts/smoke-windows
          if-no-files-found: warn

  package:
    name: Portable Windows zip
    needs: [analyze, test-linux, test-crlf, test-windows]
    runs-on: windows-latest
    concurrency:
      group: ci-${{ github.ref }}-package-${{ github.event_name == 'workflow_dispatch' && 'by-hand' || 'auto' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 20
    outputs:
      full: ${{ steps.stamp.outputs.full }}
      channel: ${{ steps.stamp.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
      # This run's number and commit, and the channel: release for the tag v<version>, dev for anything else.
      - name: Stamp the build (tools/stamp-build.js)
        id: stamp
        shell: pwsh
        run: node tools/stamp-build.js --run ${{ github.run_number }} --commit ${{ github.sha }} --ref ${{ github.ref }}
      # Downloads Node and cloudflared at pinned versions (checksum-verified), stages the app with production
      # dependencies and empty data/uploads folders, and zips it under the build's name.
      - name: Build the portable bundle (tools/build-portable.ps1)
        shell: pwsh
        run: ./tools/build-portable.ps1
      # Every path the zip makes once a person extracts it, as Explorer's Extract All lays it: under a browser's Downloads
      # folder in the profile folder of the longest user name Windows takes (C:\Users\<20 characters>\Downloads), then the
      # folder Extract All names after the zip, then the bundle's own folder, AGMessage; and every path of a clean copy
      # beside it (make-shareable-copy.bat, under the longest name it gives one). A file's path stays under 260 characters
      # and a folder's under 248 (MAX_PATH, which Extract All is held to), or the job fails naming each. It measures the
      # zip downloaded on its own: a release's, or this run's moved out of the artifact zip GitHub wraps it in.
      - name: Every path in the zip, extracted from a Downloads folder, under 260 characters (tools/zip-paths.js)
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          node tools/zip-paths.js $zip[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "a path in the bundle is too long once extracted from a Downloads folder (tools/zip-paths.js, exit $LASTEXITCODE)" }
      # The shipped bundle, run as a person runs it after Extract All: the zip extracted to a throwaway folder, its own
      # node.exe running its own watchdog (no AGM_OPEN: nothing is opened), and /api/health must answer within 30 s with
      # the build this run stamped. Then its audit log is exported by the token at the laptop, extracted with
      # Expand-Archive, and checked by the release's verifier (agmessage-audit-verifier-*.zip) on the bundle's node.exe
      # against the signing key health names: exit 0. The console goes to a file, shown only if a step fails.
      - name: Start the bundle (the zip, extracted), and check an export of its audit log
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          $dest = Join-Path $env:RUNNER_TEMP 'bundle-start'
          Expand-Archive -Path $zip[0].FullName -DestinationPath $dest -Force
          # The zip holds one folder, AGMessage, whatever the build (tools/build-portable.ps1).
          $top = @(Get-ChildItem $dest -Force)
          if ($top.Count -ne 1 -or $top[0].Name -cne 'AGMessage' -or -not $top[0].PSIsContainer) { throw "the zip's top holds $($top.Count): $(($top | ForEach-Object Name) -join ', '); it should hold one folder, AGMessage" }
          $root = $top[0].FullName
          $out = Join-Path $env:RUNNER_TEMP 'bundle-start.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'bundle-start.err.log'
          $env:PORT = '3123'
          $env:ADMIN_TOKEN = [guid]::NewGuid().ToString('N').Substring(0, 16)
          Remove-Item Env:AGM_OPEN -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Join-Path $root 'node\node.exe') -ArgumentList ('"' + (Join-Path $root 'app\supervise.js') + '"') `
            -WorkingDirectory $root -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $want = '${{ steps.stamp.outputs.full }}'
          $build = ''
          $checked = $null
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
              try { $build = (Invoke-RestMethod -Uri 'http://127.0.0.1:3123/api/health' -TimeoutSec 2).build; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if ($build -eq $want) {
              Invoke-WebRequest -Uri 'http://127.0.0.1:3123/api/admin/login' -Method Post -ContentType 'application/json' -Body (@{ token = $env:ADMIN_TOKEN } | ConvertTo-Json) -SessionVariable agm -UseBasicParsing | Out-Null
              $fp = (Invoke-RestMethod -Uri 'http://127.0.0.1:3123/api/health' -WebSession $agm).saves.stores.audit.signKey
              $exportZip = Join-Path $env:RUNNER_TEMP 'audit-export.zip'
              Invoke-WebRequest -Uri 'http://127.0.0.1:3123/api/audit/export' -Method Post -WebSession $agm -OutFile $exportZip -UseBasicParsing
              $exportDir = Join-Path $env:RUNNER_TEMP 'audit-export'
              Expand-Archive -Path $exportZip -DestinationPath $exportDir -Force
              $bundle = (Get-ChildItem $exportDir -Directory | Select-Object -First 1).FullName
              $verifierZip = @(Get-ChildItem dist -Filter 'agmessage-audit-verifier-*.zip')
              if ($verifierZip.Count -ne 1) { throw "expected one verifier zip in dist, found $($verifierZip.Count)" }
              $verifierDir = Join-Path $env:RUNNER_TEMP 'audit-verifier'
              Expand-Archive -Path $verifierZip[0].FullName -DestinationPath $verifierDir -Force
              $verifyJs = (Get-ChildItem $verifierDir -Recurse -Filter 'verify-audit.js' | Select-Object -First 1).FullName
              & (Join-Path $root 'node\node.exe') $verifyJs $bundle --fingerprint $fp
              $checked = $LASTEXITCODE
            }
          } finally {
            # The watchdog's server is ended with it (the job object it runs its children in); any left is ended by its path.
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$root*" } | Stop-Process -Force
          }
          if ($build -ne $want) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "the bundle answered build '$build' within 30 s; this run stamped '$want'"
          }
          Write-Host "The bundle started and answered as $build"
          if ($checked -ne 0) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "the release's verifier exited $checked on the bundle's audit export (0: signed by the key health names, whole, intact)"
          }
          Write-Host 'The bundle exported its audit log, and the release verifier checked it: exit 0'
      # The bill of materials (CycloneDX): every package the bundle ships, at its version — the SOUP list a reviewer reads.
      # npm's packages, then the browser libraries vendored in app/public/vendor (VENDOR.json), read from the bundle as
      # the zip extracts it, each with its file's SHA-256, the libraries bundled in it and the analysis of each advisory
      # against them. A shipped vendored file whose bytes are not the ones its entry records, or a bundle without the
      # list, THIRD-PARTY-NOTICES.md and every licence folder as this checkout has them, stops here.
      - name: Software bill of materials
        shell: pwsh
        run: |
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only --prefix app | Out-File -Encoding utf8 dist/agmessage-sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw 'npm sbom failed' }
          $shipped = Join-Path $env:RUNNER_TEMP 'bundle-start\AGMessage'
          node tools/vendor-sbom.js dist/agmessage-sbom.cdx.json --tree $shipped
          if ($LASTEXITCODE -ne 0) { throw 'the bundle''s vendored libraries could not be added to the SBOM (tools/vendor-sbom.js)' }
          # The list is taken before SHA256SUMS is written, so the file being written is never one being hashed.
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS' })
          $lines = foreach ($f in $files) { '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          Set-Content -Path dist/SHA256SUMS -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: agmessage-portable-${{ github.sha }}
          path: |
            dist/*.zip
            dist/agmessage-sbom.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
      # The bundle zip alone, an artifact of its own named after it (archive: false; its name is the file's): a run's
      # development build downloads as the zip itself, as a release's does, so Extract All lays it as the check above
      # measured it. The artifact above, a zip around the zip, is the one the readings and the release download.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/AGMessage-Portable-*.zip
          archive: false
          if-no-files-found: error

  # The installer (the 0.6.0 plan's Part 6, unit U13): installer/AGMessage.iss compiled by Inno Setup 7.1.0 on windows-2025,
  # the image its life cycle is proven on, from the zip the package job built, extracted, without its two .bat files
  # (installer/build-installer.ps1, which reads the build's defines with the zip's own node.exe and checks the version the
  # file carries), with SHA256SUMS.payload beside it. Inno Setup is pinned by hash, and on every run the pin must equal
  # the digest GitHub's release API gives the asset and the file must carry its publisher's valid signature. The installer
  # is built here and never run: installing, upgrading, going back and uninstalling are its life cycle's, the elevated job
  # after it. Every action is pinned by its commit.
  installer:
    name: Windows installer
    needs: package
    runs-on: windows-2025
    concurrency:
      group: ci-${{ github.ref }}-installer-${{ github.event_name == 'workflow_dispatch' && 'by-hand' || 'auto' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agmessage-portable-${{ github.sha }}
          path: dist
      - name: Inno Setup 7.1.0 (pinned)
        shell: pwsh
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Inno Setup 7.1.0 (Jordan Russell's licence: any use; a commercial user is asked, not required, to buy a licence),
          # installed for this job only. The pin is the release's own: it equals the digest GitHub's release API gives the
          # asset (computed by GitHub when the asset was uploaded), and the file carries a valid Authenticode signature by its
          # publisher, Pyrsys B.V.; a pin that is not both is refused.
          $ErrorActionPreference = 'Stop'
          $pin = '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F'
          $asset = 'innosetup-7.1.0-x64.exe'
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/$asset"
          $is = Join-Path $env:RUNNER_TEMP 'is.exe'
          Invoke-WebRequest -Uri $url -OutFile $is
          $hash = (Get-FileHash $is -Algorithm SHA256).Hash
          if ($hash -ne $pin) { throw "$url is not the pinned build ($hash)" }
          $release = gh api repos/jrsoftware/issrc/releases/tags/is-7_1_0
          if ($LASTEXITCODE -ne 0) { throw "the release API could not be read ($LASTEXITCODE): $release" }
          $digest = @((($release -join "`n") | ConvertFrom-Json).assets | Where-Object { $_.name -eq $asset } | ForEach-Object { $_.digest }) -join ' '
          if ("$digest".Trim() -ne "sha256:$($pin.ToLowerInvariant())") { throw "the release API's digest of $asset is '$digest', not the pin's" }
          $signature = Get-AuthenticodeSignature $is
          if ($signature.Status -ne 'Valid') { throw "$asset carries no valid signature: $($signature.Status) $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Subject -notmatch '(^|, )CN=Pyrsys B\.V\.(,|$)') { throw "$asset is signed by $($signature.SignerCertificate.Subject), not its publisher" }
          "- Inno Setup 7.1.0: the pin equals the release API's digest; signed by $($signature.SignerCertificate.Subject)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process $is -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup did not install ISCC.exe in $dir" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
      - name: Build the installer from the zip's stage (installer/build-installer.ps1)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          $dest = Join-Path $env:RUNNER_TEMP 'installer-stage'
          Expand-Archive -Path $zip[0].FullName -DestinationPath $dest -Force
          ./installer/build-installer.ps1 -Stage (Join-Path $dest 'AGMessage') -Iscc $env:ISCC -Out installer-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: agmessage-installer-${{ github.sha }}
          path: |
            installer-dist/AGMessage-Setup-*-unsigned.exe
            installer-dist/SHA256SUMS.payload
          if-no-files-found: error

  # The installer's life cycle (the 0.6.0 plan's Part 6, unit U16), run for real on windows-2025, elevated (a hosted
  # runner's account is an administrator, never prompted), on GitHub's image as it is, Defender's real-time monitoring
  # off as the image leaves it (nothing here turns it on, and whether the installer passes under Defender is no longer
  # tested in CI: the comment before its first step says why and where it is taken instead): this build's installer, the
  # one the installer job built and a release ships, the build before it and a build that does not start, both made here
  # from this build's payload (the zip's stage, its build.json stamped again by tools/lifecycle.js stage) with Inno
  # Setup 7.1.0 pinned and checked as the installer job pins it. The release order is asked first: this build must be
  # above the newest release by MAJOR.MINOR.BUILD, or an installed AGMessage of that release would refuse it.
  # installer/test/*.test.js are node:test files, run one after another, and every test they declare must have run and
  # passed (tools/lifecycle.js count, reading the run's TAP report): none skipped, left to do or missing. A gate, as
  # every test is: the release publishes only once it passed. Every action is pinned by its commit; every step has a
  # bound of its own, and together they end inside the job's; the life cycle's step holds every bound its tests and
  # hooks declare (test/lifecycle.test.js), so a slow run that keeps to them is never cut short unexplained.
  lifecycle:
    name: Installer life cycle (Windows, elevated)
    needs: [package, installer]
    runs-on: windows-2025
    concurrency:
      group: ci-${{ github.ref }}-lifecycle-${{ github.event_name == 'workflow_dispatch' && 'by-hand' || 'auto' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      # On the image as it is: Defender's real-time monitoring off and C:\ and D:\ excluded, as GitHub's image leaves them,
      # and nothing here turns it on. In runs 105, 109 and 110 every job that ran tools/defender-on.ps1 was lost. Seen in
      # run 110: its four such jobs (this one, the lane and two canaries; three of the four with the runner's own processes
      # and folder excluded again) went silent about ten minutes after Defender came on and were failed by the service
      # about 45 minutes after their last report. Derived for runs 105 and 109, from the 45 minutes the service was
      # reported (not seen) to wait: some 10 to 11 minutes after it came on. A job left as the image made it lived its
      # whole hour beside three that were lost (run 109). The life cycle runs far longer than ten minutes, so it runs as
      # that job did, and whether an install, an upgrade, a rollback, a go back and an uninstall pass under Defender is
      # no longer tested in CI: the readings lane's R2, R9 and R10 time laying the payload, the upgrade's backup and
      # node.exe's extraction with it on, and none of them runs the installer. The installer under the laptop's own
      # Defender is the show laptop's: lab 6's upgrade during a rehearsal and lab 7's Upgrade and Go back; no lab line
      # takes a first install, a rollback or an uninstall under it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ env.NODE_LTS }}
      # The life cycle seeds the installed node as a page does, with socket.io-client from app's lockfile.
      - name: The packages the life cycle's pages use (npm ci)
        working-directory: app
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agmessage-portable-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agmessage-installer-${{ github.sha }}
          path: installer-dist
      - name: Inno Setup 7.1.0 (pinned)
        shell: pwsh
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As the installer job installs it: the pin equals the release API's digest of the asset, and the file carries a
          # valid Authenticode signature by its publisher, Pyrsys B.V.; a pin that is not both is refused.
          $ErrorActionPreference = 'Stop'
          $pin = '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F'
          $asset = 'innosetup-7.1.0-x64.exe'
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/$asset"
          $is = Join-Path $env:RUNNER_TEMP 'is.exe'
          Invoke-WebRequest -Uri $url -OutFile $is
          $hash = (Get-FileHash $is -Algorithm SHA256).Hash
          if ($hash -ne $pin) { throw "$url is not the pinned build ($hash)" }
          $release = gh api repos/jrsoftware/issrc/releases/tags/is-7_1_0
          if ($LASTEXITCODE -ne 0) { throw "the release API could not be read ($LASTEXITCODE): $release" }
          $digest = @((($release -join "`n") | ConvertFrom-Json).assets | Where-Object { $_.name -eq $asset } | ForEach-Object { $_.digest }) -join ' '
          if ("$digest".Trim() -ne "sha256:$($pin.ToLowerInvariant())") { throw "the release API's digest of $asset is '$digest', not the pin's" }
          $signature = Get-AuthenticodeSignature $is
          if ($signature.Status -ne 'Valid') { throw "$asset carries no valid signature: $($signature.Status) $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Subject -notmatch '(^|, )CN=Pyrsys B\.V\.(,|$)') { throw "$asset is signed by $($signature.SignerCertificate.Subject), not its publisher" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process $is -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup did not install ISCC.exe in $dir" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
      # The newest release published, and the build its notes name on their first line ("Build <version>+<build>.<commit>.",
      # as the release job writes them). A list or notes that cannot be read stop the job: nothing is ordered unread.
      - name: The release order (tools/lifecycle.js order)
        shell: pwsh
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // ""'
          if ($LASTEXITCODE -ne 0) { throw "the releases could not be read ($LASTEXITCODE): the release order cannot be told" }
          $last = @()
          if ($tag) {
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json body --jq '.body' | Out-File -FilePath $notes -Encoding utf8NoBOM
            if ($LASTEXITCODE -ne 0) { throw "the notes of $tag could not be read ($LASTEXITCODE): the release order cannot be told" }
            $last = @('--last', $tag, '--notes', $notes)
          }
          node tools/lifecycle.js order --build '${{ needs.package.outputs.full }}' @last
          if ($LASTEXITCODE -ne 0) { throw "the release order refuses this build (tools/lifecycle.js order, exit $LASTEXITCODE)" }
      # The build before this one and the next build, which does not start, laid from the zip's stage, each stamped again
      # (tools/lifecycle.js stage) and built as the installer job builds this one (installer/build-installer.ps1, which
      # checks the version each file carries); then the plan the life cycle reads (installer/test/expect.js planOf).
      - name: The build before this one, and one that does not start, from this build's payload
        id: builds
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          $setup = @(Get-ChildItem installer-dist -Filter 'AGMessage-Setup-*-unsigned.exe')
          if ($setup.Count -ne 1) { throw "expected one installer in installer-dist, found $($setup.Count)" }
          $root = Join-Path $env:RUNNER_TEMP 'lifecycle'
          Expand-Archive -Path $zip[0].FullName -DestinationPath (Join-Path $root 'stage') -Force
          $portable = Join-Path $root 'stage\AGMessage'
          $builds = @{}
          foreach ($as in 'previous', 'broken') {
            $at = Join-Path $root "$as-stage"
            node tools/lifecycle.js stage --from $portable --to $at --as $as
            if ($LASTEXITCODE -ne 0) { throw "the $as build was not stamped (tools/lifecycle.js stage, exit $LASTEXITCODE)" }
            $out = Join-Path $root $as
            ./installer/build-installer.ps1 -Stage $at -Iscc $env:ISCC -Out $out
            $exe = @(Get-ChildItem $out -Filter 'AGMessage-Setup-*-unsigned.exe')
            if ($exe.Count -ne 1) { throw "expected one $as installer in $out, found $($exe.Count)" }
            $builds[$as] = @{ exe = $exe[0].FullName; payload = (Join-Path $out 'SHA256SUMS.payload') }
          }
          $plan = @{
            work = 'C:\agm-lifecycle'; logs = (Join-Path $root 'logs'); portable = $portable
            previous = $builds['previous']; broken = $builds['broken']
            current = @{ exe = $setup[0].FullName; payload = (Resolve-Path 'installer-dist\SHA256SUMS.payload').Path }
          }
          $file = Join-Path $root 'plan.json'
          $plan | ConvertTo-Json -Depth 4 | Out-File -FilePath $file -Encoding utf8NoBOM
          "plan=$file" >> $env:GITHUB_OUTPUT
      # Every test of installer/test/*.test.js, one after another, its TAP report kept; then the executed count against the
      # declared one. Either failing fails the job. A test or hook that names no bound of its own is given the longest any
      # test declares (--test-timeout), and the file ends once its last test and hook have, whatever a hung one left running
      # (--test-force-exit: an installer, a listener, a held file), so the count and the logs' upload still run.
      - name: The life cycle (installer/test/*.test.js, every test it declares run and passed)
        shell: pwsh
        timeout-minutes: 215
        env:
          AGM_LIFECYCLE: ${{ steps.builds.outputs.plan }}
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'lifecycle\logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $tap = Join-Path $logs 'lifecycle.tap'
          node --test --test-concurrency=1 --test-force-exit --test-timeout=900000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap "--test-reporter-destination=$tap" 'installer/test/*.test.js'
          $ran = $LASTEXITCODE
          $files = @(Get-ChildItem installer/test -Filter '*.test.js' | ForEach-Object { $_.FullName })
          node tools/lifecycle.js count --tap $tap --summary $env:GITHUB_STEP_SUMMARY @files
          $counted = $LASTEXITCODE
          if ($ran -ne 0) { throw "the life cycle failed (node --test, exit $ran)" }
          if ($counted -ne 0) { throw "the life cycle did not run every test it declares (tools/lifecycle.js count, exit $counted)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: agmessage-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/lifecycle/logs
          if-no-files-found: warn

  # The Windows evidence lane (the 0.6.0 plan's Part 6, unit U7): the readings R1-R13 of the zip the package job built,
  # taken on the image the installer is proven on, each judged against its mark (tools/readings.js, which says what each
  # miss means and which readings wait for a later unit's code). They inform the release and never hold it: a reading
  # that misses its mark is written in the release's notes with the fallback its unit names; only a lane that cannot
  # write its readings fails here, and the release does not wait on that. Every action here is pinned by its commit.
  # Every step has a bound of its own, and together they end inside the job's with 5 minutes to spare (the test holds
  # the margin): a step that runs over fails, the job ends failed, never cancelled, and the release, which waits for it,
  # still publishes. The take bounds itself, so its step's limit is never what ends it: each reading has a bound of its
  # own (BOUNDS in tools/readings-take.js) and begins only while it fits in the deadline each take step gives it
  # (--deadline-min), and the take ends by itself within STOP_MIN of that deadline, its record written. Defender's
  # real-time monitoring is on only for the readings that need it (R2, R9 and R10): turned on once the zips are
  # downloaded, those three taken in a take of their own (Take A), and Defender put back as the image left it in the
  # step right after it, whatever it ended with, before any other reading, then Take A's record and Defender's being put
  # back kept on the server at once. Seen in run 110: its four jobs that ran tools/defender-on.ps1 (the life cycle, this
  # lane and two canaries; three of the four with the runner's own processes and folder excluded again, one canary with
  # them scanned) went silent about ten minutes after Defender came on, and were failed by the service about 45 minutes
  # after their last report. Derived for runs 105 and 109, where nothing was excluded, from the 45 minutes the service
  # was reported (not seen) to wait: lost some 10 to 11 minutes after it came on. A job left as the image made it lived
  # its hour (run 109), and run 101's lane, which ended about 8 minutes after turning Defender on, was not lost. Not
  # known: how. Defender is on here for tools/defender-on.ps1's read-back and Take A, whose deadline is 6 minutes, the
  # take ending itself within its step's limit: about 3.5 minutes at run 109's times (not measured with this order),
  # though a slow R2 or a slow take can keep it on past ten minutes. Whether this keeps the runner is the next run's to
  # say. The rest are taken after it, each take saying whether it was given Defender's record, and the judge holds a
  # reading that needs Defender to Defender only when the take that took it was given that record. The readings as standard accounts (R11, R6), which log on as accounts
  # the lane makes, are a take step of their own, after the record of the rest is kept as the artifact, so a runner lost
  # in them still leaves what was taken before. It runs for every push, a tag and a run asked for by hand (never a pull
  # request, whose commits are pushes already), one at a time per ref: once it runs nothing cancels it, and a newer
  # push's waits, the newest waiting taking the place of an older one, so a regression shows on the next readings taken,
  # never on a run cut short.
  readings:
    name: Windows readings (the evidence lane)
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.package.result == 'success' }}
    needs: [package, installer]
    concurrency:
      group: readings-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2025
    timeout-minutes: 125
    steps:
      # No credential is left in the checkout: the stand-in tasks run the bundle's code from this workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      # Node, the zips and the newest release before Defender is turned on: nothing measured depends on Defender while
      # they are downloaded (R2 and R10 open the zips with it on), so its window holds Take A alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ env.NODE_LTS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agmessage-portable-${{ github.sha }}
          path: dist
      # The installer, for R5's verdict on its signature: an installer job that failed leaves R5 saying so, and stops nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: agmessage-installer-${{ github.sha }}
          path: installer-dist
      # R13 reads GitHub's answer for the newest release published, from a SYSTEM task that holds no token; R2 lays this
      # build over that release's payload. Only R13 and R2 need these, so a GitHub answer that fails here stops nothing:
      # R13 then reads not run, and R2 lays this build over its own, each saying why.
      - name: The newest release published (for R13), and its zip (for R2)
        id: release
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // ""'
          if ($LASTEXITCODE -ne 0 -or "$tag" -notmatch '^v\d+\.\d+\.\d+$') { $tag = '' }
          if ($tag) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'AGMessage-Portable-*.zip' --dir (Join-Path $env:RUNNER_TEMP 'previous')
            if ($LASTEXITCODE -ne 0) { Write-Host "the zip of $tag was not downloaded: R2 lays this build over its own" }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0
      # Before any of the bundle is laid down or measured: the image turns Defender's real-time monitoring off and
      # excludes C:\ and D:\. The readings that need it are taken with it back on in the step right after this, and
      # whether that took is recorded beside them; it is put back as the image left it in the step after that.
      - name: Defender's real-time monitoring back on, the image's exclusions removed (tools/defender-on.ps1)
        shell: powershell
        timeout-minutes: 5
        run: ./tools/defender-on.ps1 -Out "$env:RUNNER_TEMP\defender.json"
      # Take A: the readings that need Defender (R2, R9 and R10), with its monitoring on, within a deadline of 6 minutes.
      # Each begins only while its own bound (5, 2 and 2 minutes) fits in what is left of it: at run 109's times (R2 142 s,
      # the payload laid in about 20 s, R10 15 s, R9 3 s; about 3 minutes) all three begin with about a minute to spare,
      # and an R2 past about 3.4 minutes leaves R9 not taken this run, one past about 3.7 minutes R10 too. The take ends
      # by itself as soon as they have, and in any case within this step's limit (the deadline and STOP_MIN), its record
      # written: Defender stays on for about 3.5 minutes at run 109's times (not measured with this order), and a slow R2
      # or a slow take can keep it on past ten minutes. R2 lays this build over the newest release's zip, as the take of
      # every reading did.
      - name: Take the readings that need Defender, with it on (R2, R9, R10; tools/readings-take.js)
        shell: pwsh
        timeout-minutes: 12
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          $previous = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'previous') -Filter 'AGMessage-Portable-*.zip' -ErrorAction SilentlyContinue)
          $over = if ($previous.Count -eq 1) { @('--previous', $previous[0].FullName) } else { @() }
          # The release named and the installer, as the take of every reading was given them: no --tag at all when none is
          # named, never an empty argument, and no --installer when its job built none.
          $release = if ($env:RELEASE_TAG) { @('--repo', $env:GITHUB_REPOSITORY, '--tag', $env:RELEASE_TAG) } else { @() }
          $setup = @(Get-ChildItem installer-dist -Filter 'AGMessage-Setup-*-unsigned.exe' -ErrorAction SilentlyContinue)
          $installer = if ($setup.Count -eq 1) { @('--installer', $setup[0].FullName) } else { @() }
          node tools/readings-take.js take --zip $zip[0].FullName --defender "$env:RUNNER_TEMP\defender.json" --out readings/readings.raw.json --deadline-min 6 --only R2,R9,R10 @release @over @installer
          if ($LASTEXITCODE -ne 0) { throw "the lane could not write its readings with Defender (exit $LASTEXITCODE)" }
      # Defender as the image left it, whatever the take before ended with and before any other reading: real-time
      # monitoring off, the runner's own exclusions removed and the image's put back, each recorded as it goes and read
      # back from Defender (tools/defender-off.ps1). It never fails the job.
      - name: Defender as the image left it, real-time monitoring off and its exclusions back (tools/defender-off.ps1)
        if: always()
        shell: powershell
        timeout-minutes: 3
        run: ./tools/defender-off.ps1 -Record "$env:RUNNER_TEMP\defender.json" -Out readings/defender-off.json
      # What Take A took and Defender's being put back (tools/defender-off.ps1's record, in the record's folder), kept on
      # the server at once, whatever they ended with, under a name of its own: a runner lost in a later take still leaves
      # them. A small folder, bounded as the canaries' uploads are.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 3
        with:
          name: agmessage-readings-${{ github.sha }}-defender-${{ github.run_attempt }}
          path: readings
          if-no-files-found: warn
          overwrite: true
      # The rest but the two as standard accounts, added to the same record without Defender (no --defender: the record
      # keeps Defender as the take before read it, and this take is written as given no Defender record), within a
      # deadline of 23 minutes (these readings took about 6 in run 109), whatever the takes before ended with: the take
      # ends by itself inside this step's limit (the deadline and STOP_MIN), its record written, whatever a reading met.
      # R2, R9 and R10 are kept as the take before wrote them.
      - name: Take the readings that need no Defender, with it off again (tools/readings-take.js)
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 29
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          # No release named: no --tag at all, never an empty argument, and R13 reads not run with why.
          $release = if ($env:RELEASE_TAG) { @('--repo', $env:GITHUB_REPOSITORY, '--tag', $env:RELEASE_TAG) } else { @() }
          # The installer, when its job built it: R5 reads Windows' verdict on its signature beside the two programs'.
          $setup = @(Get-ChildItem installer-dist -Filter 'AGMessage-Setup-*-unsigned.exe' -ErrorAction SilentlyContinue)
          $installer = if ($setup.Count -eq 1) { @('--installer', $setup[0].FullName) } else { @() }
          node tools/readings-take.js take --zip $zip[0].FullName --out readings/readings.raw.json --deadline-min 23 --skip R2,R9,R10,R11,R6 --add @release @installer
          if ($LASTEXITCODE -ne 0) { throw "the lane could not write its readings (exit $LASTEXITCODE)" }
      # What was taken, kept on the server before any standard account is made: a runner lost after this still leaves it,
      # under a name of its own (the record's last upload, under the release's name, would delete it first).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: agmessage-readings-${{ github.sha }}-taken-${{ github.run_attempt }}
          path: readings
          if-no-files-found: warn
          overwrite: true
      # R11 and R6, added to the same record (--add) without Defender, within a deadline of 24 minutes, whatever the takes
      # before ended with.
      - name: Take the readings as standard accounts (R11, R6; tools/readings-take.js)
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 30
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          node tools/readings-take.js take --zip $zip[0].FullName --out readings/readings.raw.json --deadline-min 24 --only R11,R6 --add
          if ($LASTEXITCODE -ne 0) { throw "the lane could not write its readings as standard accounts (exit $LASTEXITCODE)" }
      # The record is written before the first reading, as each begins and after each, so a take step that did not end
      # still has what it took judged.
      - name: Judge them against their marks (tools/readings.js)
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          node tools/readings.js judge readings/readings.raw.json --out readings/readings.json --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "the lane's record could not be judged (exit $LASTEXITCODE)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: agmessage-readings-${{ github.sha }}
          path: readings
          if-no-files-found: warn
          overwrite: true

  # A question, removed once it is answered. Run 110 answered the last: the runner was lost with the runner's own
  # processes and folder excluded again (tools/defender-on.ps1, as the life cycle and the lane then did) and with them
  # scanned alike. Seen: its four jobs that ran tools/defender-on.ps1 (the life cycle, the lane and both canaries; three of
  # the four with the runner's own excluded, one canary with them scanned) went silent within a second or two of
  # 15:00:28, Defender's real-time protection having come on at 14:50:13 to 14:50:27, and the service failed them at
  # 15:45:57 to about 15:47, about 45 minutes after their last report. Only the two canaries kept evidence: uploaded at
  # 15:00:27, it shows healthy machines up to their last heartbeat at 15:00:12 (Defender's CPU low, 13 GB free, the
  # runner listener's connections established, no detection or scan in Defender's log). Not known: how, which cannot be
  # seen from inside the machine. Tried and lost: nothing excluded (runs 105 and 109, run 110's scanned canary) and only
  # the runner's own excluded (run 110). These two ask the next: does a runner live its hour when Defender is turned back
  # on and put back as the image left it some 4 to 5 minutes later (on-then-off: tools/defender-on.ps1, the evidence at 2
  # and 4 minutes and their uploads, then tools/defender-off.ps1; the lane's own window is typically similar, about 4
  # minutes, not measured); and does turning the real-time monitoring on alone, the image's C:\ and D:\ exclusions kept,
  # never yet tried, end a runner (monitoring-only). Each writes its evidence every 20 s
  # (tools/canary-evidence.ps1, run by each step for its minutes) and uploads it after each under a name of its own
  # (never over an upload before, which upload-artifact deletes first), each step going on whatever the one before ended
  # with, so what it held when it was last heard survives it. The release waits for neither.
  canary:
    name: Canary, a runner with Defender ${{ matrix.defender }} (no AGMessage work)
    needs: [package, installer]
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        defender: [on-then-off, monitoring-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Defender's real-time monitoring back on, the image's exclusions removed (tools/defender-on.ps1)
        if: ${{ matrix.defender == 'on-then-off' }}
        shell: powershell
        timeout-minutes: 5
        run: ./tools/defender-on.ps1 -Out "$env:RUNNER_TEMP\canary\defender.json"
      - name: Defender's real-time monitoring on alone, the image's exclusions kept
        if: ${{ matrix.defender == 'monitoring-only' }}
        shell: powershell
        timeout-minutes: 5
        run: Set-MpPreference -DisableRealtimeMonitoring $false
      - name: Alive at 2 min, the evidence written every 20 s (tools/canary-evidence.ps1)
        if: ${{ !cancelled() }}
        continue-on-error: true
