# AGMessage CI: every push and pull request runs the unit and end-to-end tests and the browser smoke test (headless
# Edge), then builds the portable Windows zip. A tag like v0.2.0 also publishes a GitHub Release with the zip.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and browser smoke
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Unit and end-to-end tests
        run: npm test

      - name: Browser smoke test (headless Edge)
        run: npm run smoke
        env:
          AGM_SMOKE_OUT: ${{ github.workspace }}/artifacts/smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots-${{ github.sha }}
          path: artifacts/smoke
          if-no-files-found: warn

  package:
    name: Portable Windows zip
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Downloads Node and cloudflared at pinned versions (checksum-verified), stages the app with production
      # dependencies and empty data/uploads folders, and zips it.
      - name: Build the portable bundle (tools/build-portable.ps1)
        shell: pwsh
        run: ./tools/build-portable.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: agmessage-portable-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agmessage-portable-${{ github.sha }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "AGMessage ${GITHUB_REF_NAME#v}" \
            --generate-notes dist/*.zip
