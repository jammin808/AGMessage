# AGMessage CI. Every push (any branch) and pull request runs the analyzers, the secret scan, every test suite with its
# coverage gate on Linux (Node 24 LTS, and Node 26 beside it), the suites again on a checkout with Windows' line ends
# (CR LF) on Linux, the tests and the browser smoke on Windows with Edge and on Linux with Chrome, then builds the
# portable Windows zip, numbered by this run (tools/stamp-build.js): a development build 0.6.0-dev.<run>+<sha> on a
# branch, a release 0.6.0+<run>.<sha> on the tag v0.6.0. The zip is extracted and started once, and must answer with that
# build. The zip is also an artifact of its own, the zip itself (archive: false). A tag publishes a GitHub Release with
# the zip, its SBOM, SHA256SUMS and a build-provenance attestation, once every job above is green and only when its
# version is above every release already published and every other version tagged, asked again just before it
# publishes, one release job at a time. For a tag, and for a run asked for by hand (Actions, CI, Run workflow), the
# Windows evidence lane takes its readings of that zip on windows-2025, with Defender's real-time monitoring back on:
# they inform the release's notes and never hold it; a push never starts it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull request supersedes the run of its ref. A run asked for by hand, which takes the readings, has a
# group of its own and is never cancelled: a push to its branch while it runs leaves it to finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'by-hand' || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # The runtime the portable bundle ships (tools/fetch-runtime.ps1 pins the same version by SHA-256).
  NODE_LTS: '24.22.1'

jobs:
  analyze:
    name: Analyzers, secret scan, version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      # The fences (eslint.config.mjs; docs/ANALYSIS.md): any finding fails the build.
      - name: Analyzers (ESLint, the security rules, the banned calls, HTML only from escaped parts)
        run: npm run lint
        working-directory: app
      - name: Secret scan (tools/scan-secrets.js)
        run: node tools/scan-secrets.js
      # A tag is released only when it names app/package.json's version and that version is above every release already
      # published and every other version tagged (SemVer), so among releases SemVer and MAJOR.MINOR.BUILD, the order
      # "newer" is read by, agree. Asked here first, so a tag that would be refused stops before the tests; the release
      # job asks again just before it publishes. A list that cannot be read stops the release: the assignment fails the
      # step.
      - name: The version this commit builds as
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/stamp-build.js --print
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            released="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName')"
            tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')"
            node tools/stamp-build.js --check-tag "${GITHUB_REF_NAME}" --released "$released" --tags "$tags"
          fi

  test-linux:
    name: Tests (Node ${{ matrix.node }}, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 24 is the LTS the bundle ships; 26 enters LTS on 2026-10-28 and is proven here before the bundle moves to it.
        node: ['24.22.1', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Unit, end-to-end and watchdog tests with the coverage gate
        if: matrix.node == env.NODE_LTS
        run: npm run coverage
        working-directory: app
      - name: Unit, end-to-end and watchdog tests
        if: matrix.node != env.NODE_LTS
        run: npm test
        working-directory: app
      - name: Browser smoke (headless Chrome)
        if: matrix.node == env.NODE_LTS
        run: npm run smoke
        working-directory: app
        env:
          AGM_BROWSER: /usr/bin/google-chrome
          AGM_SMOKE_OUT: ${{ github.workspace }}/artifacts/smoke-linux
      - name: Upload screenshots
        if: always() && matrix.node == env.NODE_LTS
        uses: actions/upload-artifact@v7
        with:
          name: smoke-linux-${{ github.sha }}
          path: artifacts/smoke-linux
          if-no-files-found: ignore

  # The suites as a Windows checkout has them, on Linux: every text file the .gitattributes leaves to the platform
  # checked out again with CR LF line ends, as Git for Windows does. A test that reads a source and assumes LF fails
  # here, in minutes, before the Windows job.
  test-crlf:
    name: Tests on a CR LF checkout (Node 24, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check the tree out again with Windows' line ends
        run: |
          git config core.autocrlf true
          git ls-files -z | xargs -0 rm -f --
          git checkout -- .
          if ! grep -q $'\r$' app/server.js; then echo "::error::app/server.js was not checked out with CR LF"; exit 1; fi
          if grep -q $'\r' app/public/vendor/VENDOR.json; then echo "::error::a vendored file was converted"; exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Unit, end-to-end and watchdog tests
        run: npm test
        working-directory: app

  test-windows:
    name: Tests and browser smoke (Windows, Edge)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit, end-to-end and watchdog tests
        run: npm test
      - name: Browser smoke (headless Microsoft Edge)
        run: npm run smoke
        env:
          AGM_SMOKE_OUT: ${{ github.workspace }}/artifacts/smoke-windows
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-windows-${{ github.sha }}
          path: artifacts/smoke-windows
          if-no-files-found: warn

  package:
    name: Portable Windows zip
    needs: [analyze, test-linux, test-crlf, test-windows]
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      full: ${{ steps.stamp.outputs.full }}
      channel: ${{ steps.stamp.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
      # This run's number and commit, and the channel: release for the tag v<version>, dev for anything else.
      - name: Stamp the build (tools/stamp-build.js)
        id: stamp
        shell: pwsh
        run: node tools/stamp-build.js --run ${{ github.run_number }} --commit ${{ github.sha }} --ref ${{ github.ref }}
      # Downloads Node and cloudflared at pinned versions (checksum-verified), stages the app with production
      # dependencies and empty data/uploads folders, and zips it under the build's name.
      - name: Build the portable bundle (tools/build-portable.ps1)
        shell: pwsh
        run: ./tools/build-portable.ps1
      # Every path the zip makes once a person extracts it, as Explorer's Extract All lays it: under a browser's Downloads
      # folder in the profile folder of the longest user name Windows takes (C:\Users\<20 characters>\Downloads), then the
      # folder Extract All names after the zip, then the bundle's own folder, AGMessage; and every path of a clean copy
      # beside it (make-shareable-copy.bat, under the longest name it gives one). A file's path stays under 260 characters
      # and a folder's under 248 (MAX_PATH, which Extract All is held to), or the job fails naming each. It measures the
      # zip downloaded on its own: a release's, or this run's moved out of the artifact zip GitHub wraps it in.
      - name: Every path in the zip, extracted from a Downloads folder, under 260 characters (tools/zip-paths.js)
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          node tools/zip-paths.js $zip[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "a path in the bundle is too long once extracted from a Downloads folder (tools/zip-paths.js, exit $LASTEXITCODE)" }
      # The shipped bundle, run as a person runs it after Extract All: the zip extracted to a throwaway folder, its own
      # node.exe running its own watchdog (no AGM_OPEN: nothing is opened), and /api/health must answer within 30 s with
      # the build this run stamped. Then its audit log is exported by the token at the laptop, extracted with
      # Expand-Archive, and checked by the release's verifier (agmessage-audit-verifier-*.zip) on the bundle's node.exe
      # against the signing key health names: exit 0. The console goes to a file, shown only if a step fails.
      - name: Start the bundle (the zip, extracted), and check an export of its audit log
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          $dest = Join-Path $env:RUNNER_TEMP 'bundle-start'
          Expand-Archive -Path $zip[0].FullName -DestinationPath $dest -Force
          # The zip holds one folder, AGMessage, whatever the build (tools/build-portable.ps1).
          $top = @(Get-ChildItem $dest -Force)
          if ($top.Count -ne 1 -or $top[0].Name -cne 'AGMessage' -or -not $top[0].PSIsContainer) { throw "the zip's top holds $($top.Count): $(($top | ForEach-Object Name) -join ', '); it should hold one folder, AGMessage" }
          $root = $top[0].FullName
          $out = Join-Path $env:RUNNER_TEMP 'bundle-start.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'bundle-start.err.log'
          $env:PORT = '3123'
          $env:ADMIN_TOKEN = [guid]::NewGuid().ToString('N').Substring(0, 16)
          Remove-Item Env:AGM_OPEN -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Join-Path $root 'node\node.exe') -ArgumentList ('"' + (Join-Path $root 'app\supervise.js') + '"') `
            -WorkingDirectory $root -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $want = '${{ steps.stamp.outputs.full }}'
          $build = ''
          $checked = $null
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
              try { $build = (Invoke-RestMethod -Uri 'http://127.0.0.1:3123/api/health' -TimeoutSec 2).build; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if ($build -eq $want) {
              Invoke-WebRequest -Uri 'http://127.0.0.1:3123/api/admin/login' -Method Post -ContentType 'application/json' -Body (@{ token = $env:ADMIN_TOKEN } | ConvertTo-Json) -SessionVariable agm -UseBasicParsing | Out-Null
              $fp = (Invoke-RestMethod -Uri 'http://127.0.0.1:3123/api/health' -WebSession $agm).saves.stores.audit.signKey
              $exportZip = Join-Path $env:RUNNER_TEMP 'audit-export.zip'
              Invoke-WebRequest -Uri 'http://127.0.0.1:3123/api/audit/export' -Method Post -WebSession $agm -OutFile $exportZip -UseBasicParsing
              $exportDir = Join-Path $env:RUNNER_TEMP 'audit-export'
              Expand-Archive -Path $exportZip -DestinationPath $exportDir -Force
              $bundle = (Get-ChildItem $exportDir -Directory | Select-Object -First 1).FullName
              $verifierZip = @(Get-ChildItem dist -Filter 'agmessage-audit-verifier-*.zip')
              if ($verifierZip.Count -ne 1) { throw "expected one verifier zip in dist, found $($verifierZip.Count)" }
              $verifierDir = Join-Path $env:RUNNER_TEMP 'audit-verifier'
              Expand-Archive -Path $verifierZip[0].FullName -DestinationPath $verifierDir -Force
              $verifyJs = (Get-ChildItem $verifierDir -Recurse -Filter 'verify-audit.js' | Select-Object -First 1).FullName
              & (Join-Path $root 'node\node.exe') $verifyJs $bundle --fingerprint $fp
              $checked = $LASTEXITCODE
            }
          } finally {
            # The watchdog's server is ended with it (the job object it runs its children in); any left is ended by its path.
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$root*" } | Stop-Process -Force
          }
          if ($build -ne $want) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "the bundle answered build '$build' within 30 s; this run stamped '$want'"
          }
          Write-Host "The bundle started and answered as $build"
          if ($checked -ne 0) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "the release's verifier exited $checked on the bundle's audit export (0: signed by the key health names, whole, intact)"
          }
          Write-Host 'The bundle exported its audit log, and the release verifier checked it: exit 0'
      # The bill of materials (CycloneDX): every package the bundle ships, at its version — the SOUP list a reviewer reads.
      # npm's packages, then the browser libraries vendored in app/public/vendor (VENDOR.json), read from the bundle as
      # the zip extracts it, each with its file's SHA-256, the libraries bundled in it and the analysis of each advisory
      # against them. A shipped vendored file whose bytes are not the ones its entry records, or a bundle without the
      # list, THIRD-PARTY-NOTICES.md and every licence folder as this checkout has them, stops here.
      - name: Software bill of materials
        shell: pwsh
        run: |
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only --prefix app | Out-File -Encoding utf8 dist/agmessage-sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw 'npm sbom failed' }
          $shipped = Join-Path $env:RUNNER_TEMP 'bundle-start\AGMessage'
          node tools/vendor-sbom.js dist/agmessage-sbom.cdx.json --tree $shipped
          if ($LASTEXITCODE -ne 0) { throw 'the bundle''s vendored libraries could not be added to the SBOM (tools/vendor-sbom.js)' }
          # The list is taken before SHA256SUMS is written, so the file being written is never one being hashed.
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS' })
          $lines = foreach ($f in $files) { '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          Set-Content -Path dist/SHA256SUMS -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: agmessage-portable-${{ github.sha }}
          path: |
            dist/*.zip
            dist/agmessage-sbom.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
      # The bundle zip alone, an artifact of its own named after it (archive: false; its name is the file's): a run's
      # development build downloads as the zip itself, as a release's does, so Extract All lays it as the check above
      # measured it. The artifact above, a zip around the zip, is the one the readings and the release download.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/AGMessage-Portable-*.zip
          archive: false
          if-no-files-found: error

  # The Windows evidence lane (the 0.6.0 plan's Part 6, unit U7): the readings R1-R13 of the zip the package job built,
  # taken on the image the installer is proven on, each judged against its mark (tools/readings.js, which says what each
  # miss means and which readings wait for a later unit's code). They inform the release and never hold it: a reading
  # that misses its mark is written in the release's notes with the fallback its unit names; only a lane that cannot
  # write its readings fails here, and the release does not wait on that. Every action here is pinned by its commit.
  # Every step has a bound of its own, and together they end well inside the job's (the lane's own bound, BUDGET_MS in
  # tools/readings-take.js, inside the take step's): a step that runs over fails, the job ends failed, never cancelled,
  # and the release, which waits for it, still publishes. It runs for a tag and for a run asked for by hand, never for
  # a push or a pull request: a run takes up to 45 minutes, and a push would cancel it.
  readings:
    name: Windows readings (the evidence lane)
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: package
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      # No credential is left in the checkout: the stand-in tasks run the bundle's code from this workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      # First, before anything is laid down or measured: the image turns Defender's real-time monitoring off and
      # excludes C:\ and D:\. Every reading below is taken with it back on, and whether that took is recorded beside them.
      - name: Defender's real-time monitoring back on, the image's exclusions removed (tools/defender-on.ps1)
        shell: powershell
        timeout-minutes: 5
        run: ./tools/defender-on.ps1 -Out "$env:RUNNER_TEMP\defender.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ env.NODE_LTS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agmessage-portable-${{ github.sha }}
          path: dist
      # R13 reads GitHub's answer for the newest release published, from a SYSTEM task that holds no token; R2 lays this
      # build over that release's payload. Only R13 and R2 need these, so a GitHub answer that fails here stops nothing:
      # R13 then reads not run, and R2 lays this build over its own, each saying why.
      - name: The newest release published (for R13), and its zip (for R2)
        id: release
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // ""'
          if ($LASTEXITCODE -ne 0 -or "$tag" -notmatch '^v\d+\.\d+\.\d+$') { $tag = '' }
          if ($tag) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'AGMessage-Portable-*.zip' --dir (Join-Path $env:RUNNER_TEMP 'previous')
            if ($LASTEXITCODE -ne 0) { Write-Host "the zip of $tag was not downloaded: R2 lays this build over its own" }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Take the readings (tools/readings-take.js)
        shell: pwsh
        timeout-minutes: 45
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $zip = @(Get-ChildItem dist -Filter 'AGMessage-Portable-*.zip')
          if ($zip.Count -ne 1) { throw "expected one bundle zip in dist, found $($zip.Count)" }
          $previous = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'previous') -Filter 'AGMessage-Portable-*.zip' -ErrorAction SilentlyContinue)
          $over = if ($previous.Count -eq 1) { @('--previous', $previous[0].FullName) } else { @() }
          # No release named: no --tag at all, never an empty argument, and R13 reads not run with why.
          $release = if ($env:RELEASE_TAG) { @('--repo', $env:GITHUB_REPOSITORY, '--tag', $env:RELEASE_TAG) } else { @() }
          node tools/readings-take.js take --zip $zip[0].FullName --defender "$env:RUNNER_TEMP\defender.json" --out readings/readings.raw.json @release @over
          if ($LASTEXITCODE -ne 0) { throw "the lane could not write its readings (exit $LASTEXITCODE)" }
      # The record is written before the first reading and after each, so a take step cut short still has what it took
      # judged.
      - name: Judge them against their marks (tools/readings.js)
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          node tools/readings.js judge readings/readings.raw.json --out readings/readings.json --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "the lane's record could not be judged (exit $LASTEXITCODE)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: agmessage-readings-${{ github.sha }}
          path: readings
          if-no-files-found: warn

  release:
    name: GitHub Release
    # The Windows readings inform the notes and never hold the release: it waits for the lane to end, whatever it found
    # and however it ended, and publishes once the package job has.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
    needs: [package, readings]
    runs-on: ubuntu-latest
    # One release job at a time across every tag, none cancelled by the next: each reads the releases the one before it
    # published.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The release order asked again here, before anything is attested or published, of the releases and tags as they
      # stand now: another tag's run may have published, or a tag been pushed, since this run's analyze job asked.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/stamp-build.js
            tools/readings.js
            app/lib/version.js
            app/package.json
            docs/INSTALL.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
      - name: Refuse a release not above every release published and every version tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName')"
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')"
          node tools/stamp-build.js --check-tag "${GITHUB_REF_NAME}" --released "$released" --tags "$tags"
      - uses: actions/download-artifact@v8
        with:
          name: agmessage-portable-${{ github.sha }}
          path: dist
      - name: Refuse anything but a release build
        run: test "${{ needs.package.outputs.channel }}" = "release" || { echo "::error::the package job built ${{ needs.package.outputs.full }}, not a release"; exit 1; }
      - name: Build provenance (who built which zip from which commit)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip
      # The lane's readings, when it wrote them: a lane that failed or wrote none leaves the notes saying so.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agmessage-readings-${{ github.sha }}
          path: readings
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ needs.package.outputs.full }}. Extract All first (right-click the zip), then run start-agmessage.bat from the AGMessage folder it extracts: run from inside the zip it finds nothing beside it. The zip's SHA-256 is in SHA256SUMS; its packages are listed in agmessage-sbom.cdx.json. The audit log's verifier is agmessage-audit-verifier-${GITHUB_REF_NAME#v}.zip: take it from here to check an export on another computer, its SHA-256 in SHA256SUMS."
            echo
            node tools/readings.js notes readings/readings.json --install docs/INSTALL.md || printf '### The Windows readings\n\nThe Windows readings for this build could not be read: nothing is claimed for them. They inform the release and never hold it.\n'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "AGMessage ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes dist/*.zip dist/agmessage-sbom.cdx.json dist/SHA256SUMS
