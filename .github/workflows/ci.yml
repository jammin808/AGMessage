  release:
    name: GitHub Release
    # The Windows readings inform the notes and never hold the release: it waits for the lane to end, whatever it found
    # and however it ended, and publishes once the package job, the installer job and the installer's life cycle have.
    # Every action it uses is pinned by its commit, as the life cycle's and the lane's are: it is the job that attests.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && needs.installer.result == 'success' && needs.lifecycle.result == 'success' }}
    needs: [package, installer, lifecycle, readings]
    runs-on: ubuntu-latest
    # One release job at a time across every tag, none cancelled by the next: each reads the releases the one before it
    # published.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The release order asked again here, before anything is attested or published, of the releases and tags as they
      # stand now: another tag's run may have published, or a tag been pushed, since this run's analyze job asked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/stamp-build.js
            tools/readings.js
            tools/provenance.js
            app/lib/version.js
            app/package.json
            docs/INSTALL.md
            docs/DESIGN.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_LTS }}
      - name: Refuse a release not above every release published and every version tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName')"
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')"
          node tools/stamp-build.js --check-tag "${GITHUB_REF_NAME}" --released "$released" --tags "$tags"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agmessage-portable-${{ github.sha }}
          path: dist
      # The installer and its payload's sums beside the zip; SHA256SUMS is made again over every file the release carries.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agmessage-installer-${{ github.sha }}
          path: dist
      - name: SHA256SUMS of every file the release carries
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > SHA256SUMS
          test "$(grep -c 'AGMessage-Setup-.*-unsigned\.exe$' SHA256SUMS)" = 1 || { echo "::error::the release carries no installer"; exit 1; }
          cat SHA256SUMS
      - name: Refuse anything but a release build
        run: test "${{ needs.package.outputs.channel }}" = "release" || { echo "::error::the package job built ${{ needs.package.outputs.full }}, not a release"; exit 1; }
      # Every file the release attests (tools/provenance.js SUBJECTS): the zips, the installer and SHA256SUMS.payload,
      # through which the attestation reaches every file the installer lays down. A subject missing stops the release.
      - name: The files the release attests (tools/provenance.js subjects)
        run: node tools/provenance.js subjects --dir dist
      - name: Build provenance (who built which zip, installer and payload from which commit)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/AGMessage-Setup-*-unsigned.exe
            dist/SHA256SUMS.payload
      # Each attested file verified as a person checking a download verifies it (gh attestation verify, docs/INSTALL.md):
      # signed by this repository's CI workflow, for this tag and this commit, on a GitHub-hosted runner. A file that does
      # not verify stops the release before it is published.
      - name: Verify the release's own attestations (gh attestation verify)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/provenance.js subjects --dir dist > "$RUNNER_TEMP/subjects.txt"
          while IFS= read -r f; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
              || { echo "::error::$f does not verify against this release's attestation"; exit 1; }
          done < "$RUNNER_TEMP/subjects.txt"
      # The lane's readings, when it wrote them: a lane that failed or wrote none leaves the notes saying so.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agmessage-readings-${{ github.sha }}
          path: readings
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ needs.package.outputs.full }}. Extract All first (right-click the zip), then run start-agmessage.bat from the AGMessage folder it extracts: run from inside the zip it finds nothing beside it. The zip's SHA-256 is in SHA256SUMS; its packages are listed in agmessage-sbom.cdx.json. The audit log's verifier is agmessage-audit-verifier-${GITHUB_REF_NAME#v}.zip: take it from here to check an export on another computer, its SHA-256 in SHA256SUMS."
            echo
            echo "The installer, AGMessage-Setup-${GITHUB_REF_NAME#v}-unsigned.exe, is for your own show laptop (venue laptops use the portable zip): it installs AGMessage in Program Files, its data in C:\\ProgramData\\AGMessage, and it serves from boot with nobody signed in. It is not signed. Smart App Control: on a PC where it is on (Windows Security > App & browser control > Smart App Control), Windows blocks the installer and it never runs; while Smart App Control is evaluating, the installer runs and says so on its first page, and once it turns itself on, the installer, its uninstaller and the next installer are blocked. Its SHA-256 is in SHA256SUMS, and SHA256SUMS.payload holds the SHA-256 of every file it lays down."
            echo
            echo "The zips, the installer and SHA256SUMS.payload carry a build-provenance attestation, made and checked by this release's own run: check a download with gh attestation verify <file> -R $GITHUB_REPOSITORY. The installer was installed, upgraded from the build before it, refused, rolled back, gone back from and uninstalled on windows-2025 before this release was published."
            echo
            node tools/readings.js notes readings/readings.json --install docs/INSTALL.md || printf '### The Windows readings\n\nThe Windows readings for this build could not be read: nothing is claimed for them. They inform the release and never hold it.\n'
            echo
            node tools/readings.js laptop --design docs/DESIGN.md || printf '%s\n\n%s\n' "### The show laptop's readings" "The show laptop's readings could not be read: nothing is claimed for them. They inform the release and never hold it."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "AGMessage ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes dist/*.zip dist/AGMessage-Setup-*-unsigned.exe dist/SHA256SUMS.payload dist/agmessage-sbom.cdx.json dist/SHA256SUMS
      # The release as GitHub publishes it, read back: an installed AGMessage upgrades with no administrator only to an
      # immutable release, so one that is not is said plainly and fails this job. Immutable releases are the repository's
      # setting, its owner's to turn on (Settings, the Releases section); nothing here changes a setting.
      - name: The release is immutable (tools/provenance.js immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release.json"
          if node tools/provenance.js immutable --release "$RUNNER_TEMP/release.json" --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" 2> "$RUNNER_TEMP/immutable.txt"; then
            echo "- $GITHUB_REF_NAME is immutable" >> "$GITHUB_STEP_SUMMARY"
          else
            words="$(cat "$RUNNER_TEMP/immutable.txt")"
            echo "::error::$words"
            printf '### Not immutable\n\n%s\n' "$words" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
